syntax = "proto3";

package conflux.v1;

// FlTransport is reused verbatim over two hops with one schema: the network
// hop between conflux-server and conflux-node (push or pull, per topology —
// see docs/spec/conflux-spec-v1.md §3), and the local loopback gRPC hop
// between conflux-node and the Python ClientApp (no TLS, localhost only —
// see §7).
//
// Comments here become doc comments on the generated Rust types, so this
// file is the single place the wire contract is described — for the Rust
// side, the Python side, and anyone reading the schema on its own.
service FlTransport {
  // Pull mode: client asks for the next task.
  rpc FetchTask (FetchTaskRequest) returns (TaskResponse);
  // Push mode: server streams tasks to a subscribed client.
  rpc SubscribeTasks (SubscribeRequest) returns (stream TaskResponse);
  // Both modes: client streams its trained delta back.
  rpc SubmitDelta (stream DeltaChunk) returns (SubmitAck);
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

// A client announcing itself before it participates in any round.
message RegisterRequest {
  // The identity this client claims. Every later message in the round
  // pipeline is attributed to this string, and the server's allow-list
  // (when require_node_auth is on) is keyed by it.
  string client_id = 1;
  // The client's credential. What this holds depends on the deployment's
  // resolved auth mode: a signed JWT when auth = jwt (verified against
  // the server's configured public key), otherwise an opaque pre-shared
  // token compared against the allow-list. Ignored entirely on the local
  // loopback hop, where conflux-node has already registered upstream on
  // the Python client's behalf.
  string auth_token = 2;
}

// The server's answer to a registration attempt.
message RegisterResponse {
  // False means this client may not participate. A repeated registration
  // from an already-known client is accepted, not refused — treating a
  // retry as an error only makes clients retry harder.
  bool accepted = 1;
  // Human-readable detail, for logs. Never parse this; the boolean above
  // is the decision.
  string message = 2;
}

// A liveness ping. Clients that stop sending these are evicted once their
// registry TTL lapses.
message HeartbeatRequest {
  // Which client is still alive.
  string client_id = 1;
}

// The server's answer to a liveness ping.
message HeartbeatResponse {
  // False means the server no longer recognizes this client — it was
  // evicted, and the client should register again rather than continue.
  bool acknowledged = 1;
}

// Pull mode's request for whatever round is currently open.
message FetchTaskRequest {
  // Which client is asking. The server uses this to decide whether the
  // client was selected for the open round.
  string client_id = 1;
}

// Push mode's subscription. The server holds the stream open and pushes a
// TaskResponse whenever a round opens, so the client never polls.
message SubscribeRequest {
  // Which client is subscribing.
  string client_id = 1;
}

// A training task dispatched to a client: the round's starting weights.
message TaskResponse {
  // Identifies this dispatch. Distinct from `round` so a server may
  // re-dispatch one round without the client mistaking it for a new one.
  string task_id = 1;
  // Which round these weights belong to. A client must echo this back in
  // its DeltaChunks; a submission for a round that has already closed is
  // rejected rather than folded into the current one.
  uint64 round = 2;
  // The global model at the start of this round, as little-endian packed
  // f32. The server has no idea what architecture these weights describe
  // (ADR 0004) — shape and meaning are entirely the client's business.
  //
  // An all-zero buffer is the server's generic placeholder for "no
  // checkpoint yet": it cannot construct a real initialization for a
  // model it knows nothing about. A client that recognizes this
  // substitutes its own architecture-aware initialization, since training
  // a network of ReLU hidden units from all-zero weights cannot break
  // symmetry and will not learn.
  bytes model_weights = 3;

  // --- SCAFFOLD ---------------------------------------------------------
  // The server's global control variate `c`, same little-endian f32
  // encoding and same length as `model_weights`.
  //
  // This is the *downstream* half of ADR 0012's control-variate plumbing.
  // `ClientDelta.control_variate` already carried a client's `Δc_i` up;
  // without this field the server had nowhere to put `c` on the way back,
  // and SCAFFOLD's correction `(c − c_i)` is not computable by a client
  // that never learns `c`. Adding it is the same additive,
  // backward-compatible move ADR 0012 made for the upstream fields:
  // absent means "the configured aggregator maintains no control
  // variate", which is every method except SCAFFOLD.
  //
  // Only the aggregator that owns one populates this — see
  // `Aggregator::control_variate`.
  optional bytes control_variate = 4;
}

// One chunk of a streamed client update. Large deltas are split across
// multiple DeltaChunk messages sharing the same (client_id, round);
// conflux-buffer reassembles them into a ClientDelta.
message DeltaChunk {
  // Who is submitting. Must match the client_id that registered.
  string client_id = 1;
  // Which round this update trained against, echoed from TaskResponse.
  uint64 round = 2;
  // This chunk's position in the client's stream, zero-based. The server
  // sorts by this before concatenating, so chunks may arrive in any order.
  uint32 chunk_index = 3;
  // How many chunks this client's update is split into.
  uint32 total_chunks = 4;
  // This chunk's slice of the update, as little-endian packed f32.
  // Chunk boundaries are byte offsets and carry no meaning — the
  // reassembled concatenation is the update.
  bytes data = 5;
  // FedAvg's SampleCountWeighting input (McMahan et al., 2017) — repeated
  // identically on every chunk of one client's stream (cheap, and avoids
  // depending on chunk 0 arriving first) rather than sent once.
  //
  // Self-reported and unauthenticated: FedAvg's weighting takes this on
  // trust, which is an assumption of the published method rather than a
  // guarantee of the transport. The server rejects structurally
  // impossible values, and a robust aggregator ignores this field
  // entirely — both of which matter, because a client that inflates it
  // buys proportional influence over the aggregate.
  uint64 num_samples = 6;

  // --- ADR 0012 -------------------------------------------------------
  // Two optional per-client fields, for methods that need more than a
  // weight vector and a sample count. Both are `optional` with explicit
  // presence: absent means "this client is not running that method,"
  // which is a different fact from zero or empty. Every existing client
  // sets neither, and every existing aggregator ignores both.
  //
  // ADR 0012's own snippet adds these to `ClientDelta` only. They are
  // here as well because `ClientDelta` is never sent on the wire — it is
  // what the server *builds* from these chunks — so a field that exists
  // only there could never be populated by a client at all.

  // How many local optimization steps this client took this round.
  // FedNova's normalization input (Wang, Wang, Nusrat, Poor & Rajan,
  // 2020): clients that train longer produce larger updates, and
  // averaging them unnormalized silently weights whoever ran the most
  // steps.
  //
  // A scalar, so it follows `num_samples`'s convention exactly —
  // repeated identically on every chunk of one client's stream, and read
  // from whichever chunk arrives first rather than requiring chunk 0.
  // Self-reported and unauthenticated, on the same terms.
  optional uint32 local_steps = 7;

  // This chunk's slice of the client's control-variate vector.
  // SCAFFOLD's client correction term (Karimireddy, Kale, Mohri, Reddi,
  // Stich & Suresh, 2020), same dimensionality and same little-endian
  // f32 encoding as the model update itself, so no second codec exists.
  //
  // Unlike `local_steps`, this is a full vector and therefore *chunked*,
  // exactly like `data`: chunk i carries slice i, and the server
  // concatenates in `chunk_index` order. A client splitting its update
  // across N chunks splits its control variate in lockstep. Populate it
  // on every chunk or on none — a partial population reassembles into a
  // short vector, which the consuming aggregator rejects on a length
  // check, because the server itself cannot know what length is correct
  // (ADR 0004: it is opaque to model architecture).
  //
  // These bytes count toward `max_update_bytes` along with `data`. They
  // have to: the bound exists so that one client cannot grow the
  // server's heap without limit, and a ceiling that ignored a
  // client-controlled byte field would simply relocate the flood into
  // it.
  optional bytes control_variate = 8;

  // This client's local loss `F_k(w)` evaluated at the round's starting
  // global model, *before* local training. q-FedAvg's fairness input
  // (Li, Sanjabi, Beirami & Smith, 2020): clients the model currently
  // serves badly get weighted up, so the accuracy *distribution*
  // flattens rather than only its mean improving.
  //
  // A scalar, so it follows `num_samples`/`local_steps`: repeated on
  // every chunk, read from whichever arrives first. Fixed-size, so
  // unlike `control_variate` it does not count toward
  // `max_update_bytes` — there is no flood to bound in four bytes.
  //
  // Self-reported and unauthenticated, and here that matters more than
  // usual: q-FedAvg weights *up* whoever reports a high loss, so a
  // client that inflates this buys influence rather than losing it.
  // That is a property of the published method, not of the transport.
  optional float local_loss = 9;
}

// The server's answer to a completed submission.
message SubmitAck {
  // False means the update was not taken into the round — most often
  // because the round already closed on quorum or timeout while this
  // client was still training. The client should fetch the current task
  // and resubmit rather than treat it as fatal.
  bool accepted = 1;
  // Human-readable detail, for logs.
  string message = 2;
}

// A fully reassembled client update, ready for aggregation
// (conflux-core's Aggregator, conflux-reputation's ContributionScorer —
// see docs/spec/conflux-spec-v1.md §5).
//
// Never sent on the wire as-is: it is what the server builds after
// concatenating a client's DeltaChunks, and what every aggregator consumes.
message ClientDelta {
  // Who produced this update.
  string client_id = 1;
  // Which round it trained against.
  uint64 round = 2;
  // The complete trained update, little-endian packed f32, the same
  // length as the TaskResponse this client trained from.
  //
  // Any 4-byte pattern decodes, including NaN and infinity — the codec
  // cannot know which bit patterns are meaningful for a given model, so
  // aggregators validate finiteness themselves before using these values.
  bytes weights = 3;
  // FedAvg's SampleCountWeighting input (McMahan et al., 2017). See
  // DeltaChunk.num_samples for what trusting this costs.
  uint64 num_samples = 4;

  // --- ADR 0012 -------------------------------------------------------
  // Reassembled from the correspondingly-named DeltaChunk fields; see
  // those for what each means and what trusting it costs. Absent here
  // means no chunk carried one.

  // FedNova's local step count, taken from the first chunk received.
  optional uint32 local_steps = 5;

  // SCAFFOLD's control variate: every chunk's slice concatenated in
  // `chunk_index` order, the same little-endian f32 encoding as
  // `weights`. An aggregator that reads this must check it decodes to
  // the same length as `weights` — the transport cannot, being opaque to
  // model architecture.
  optional bytes control_variate = 6;
  // q-FedAvg's local loss, taken from the first chunk received. See
  // DeltaChunk.local_loss for what trusting it costs.
  optional float local_loss = 7;
}
