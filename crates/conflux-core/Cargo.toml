[package]
name = "conflux-core"
description = "Aggregation algorithms for Conflux FL — FedAvg plus eleven cited robust and cross-round methods, built on a shared family pattern."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
conflux-config = { path = "../conflux-config" }
conflux-proto = { path = "../conflux-proto" }
inventory.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
# Phase 19: `benches/accumulate.rs` keeps explicit-SIMD variants of the
# combine loop purely as the standing evidence for why the shipped code
# is scalar. Nothing in `src/` uses this.
wide.workspace = true

# The evidence for Phase 19's premise. A SIMD change nobody measured is
# an unverified claim, and this project measures.
[[bench]]
name = "accumulate"
harness = false
