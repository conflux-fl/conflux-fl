[package]
name = "conflux-attacks"
description = "Known federated-learning attacks for testing Conflux FL's defenses. Test/dev only — never a dependency of conflux-server (ADR 0010)."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# ADR 0010: test/dev-only. Publishing it would invite exactly the
# dependency edge that ADR forbids.
publish = false
version.workspace = true
edition.workspace = true

[dependencies]
conflux-proto = { path = "../conflux-proto" }
rand.workspace = true
rand_distr.workspace = true

[dev-dependencies]
# Dev-only: this crate's own tests run each attack against a real
# Aggregator (attack_vs_defense.rs), and examples/run_experiment.rs (the
# docs/research/ experiment runner) needs it too — never a normal
# dependency (ADR 0010: conflux-server's build must never pull in attack
# code, even transitively).
conflux-core = { path = "../conflux-core" }
# examples/run_experiment.rs only — JSON output for docs/research/
# scripts/*.sh to collect into JSONL results files.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
