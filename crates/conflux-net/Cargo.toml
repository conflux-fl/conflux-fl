[package]
name = "conflux-net"
version = "0.1.0"
edition = "2024"

[dependencies]
conflux-proto = { path = "../conflux-proto" }
# tls-aws-lc, not tls-ring: conflux-store's Phase 7f S3Store (aws-sdk-s3)
# pulls in rustls with the aws-lc-rs crypto provider; Cargo's workspace-wide
# feature unification means a `cargo test --workspace` run would otherwise
# link both `ring` and `aws-lc-rs` into this crate's own test binaries too,
# and rustls panics at runtime with no way to pick a default automatically.
# Matching the AWS SDK's provider avoids the conflict outright.
tonic = { version = "0.14", features = ["tls-aws-lc", "tls-connect-info"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
thiserror = "2.0"
async-trait = "0.1"
# Phase 8c: hashing a peer certificate's DER bytes into the fingerprint
# `NodeIdentity::CertFingerprint` compares against.
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.14"
# Names `Certificate::der()`'s return type in the Phase 8c fingerprint
# test — the same `rustls-pki-types` tonic's own `tls-connect-info`
# feature already pulls in, not a new crate to the dependency tree.
rustls-pki-types = "1"
