[package]
name = "conflux-client"
description = "Rust-native ClientApp SDK for Conflux FL — train in Rust, with no Python hop."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
edition.workspace = true
readme = "README.md"

[dependencies]
# The local hop to `conflux-node` speaks the same `FlTransport` schema as
# every other hop, so this needs no transport of its own —
# `PullTransport` is already exactly the client half.
conflux-net.workspace = true
conflux-proto.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
thiserror.workspace = true
tracing.workspace = true

# Burn is pre-1.0 and self-describes as having breaking changes, and it
# pulls a large dependency subtree. Keep it STRICTLY opt-in so the default
# `conflux-client` build stays lean and stable — the same blast-radius
# containment the optional trusted-reference sidecar uses. Nothing but
# the `burn_mlp` example (which requires this feature) touches it.
# CPU-only: the `ndarray` backend + `autodiff`, no GPU/CUDA/LibTorch.
burn = { version = "0.21", optional = true, default-features = false, features = [
    "ndarray",
    "autodiff",
    "std",
] }

[features]
# Enable with `--features burn`; gates the `burn_mlp` example below.
burn = ["dep:burn"]

[dev-dependencies]
tracing-subscriber.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
# Test-only: standing up a fake local hop means implementing
# `RoundDispatcher`, which is an async trait.
async-trait.workspace = true
# Also example-only: `burn_mlp` runs its clients through a real
# federation rather than aggregating them itself.
#
# This is a **dev-dependency cycle** — `conflux-federation` depends on
# this crate — which cargo permits precisely because a dev-dependency
# does not enter the dependent's own build graph. Nothing a consumer of
# `conflux-client` builds can see it.
conflux-federation.workspace = true
# Example-only: `burn_mlp` resolves the server's configuration the same
# way `conflux-baselines` exports it for the Python edge, so both edges
# of a baseline measure the same deployment.
conflux-config.workspace = true

# A real Burn MLP `ClientApp` — the deep-learning-in-Rust evaluation the
# `logreg` spike deliberately isolated itself from. Opt-in only.
[[example]]
name = "burn_mlp"
required-features = ["burn"]
