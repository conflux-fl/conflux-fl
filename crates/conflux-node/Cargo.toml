[package]
name = "conflux-node"
description = "Conflux FL client binary — Rust-side networking and orchestration, bridging to a local ClientApp (Python or Rust)."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
conflux-proto = { path = "../conflux-proto" }
conflux-net = { path = "../conflux-net" }
# The client-side privacy transform (`clip + noise` before an update
# leaves the node) is a distinct pipeline step from the server-side
# transform, and there is no way to honor it without conflux-node being
# able to reach the mechanism. Note it transitively pulls in
# conflux-config too (that's where conflux-privacy registers itself) —
# conflux-node still calls no conflux-config API directly, keeping its
# "read env vars, mirror the defaults inline" convention (see
# startup_guard.rs).
conflux-privacy = { path = "../conflux-privacy" }
rand.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# "sync": `ReceiverStream`, which adapts the mpsc channel behind
# push mode's reconnecting task relay into a `Stream`.
tokio-stream = { workspace = true, features = ["net", "sync"] }
tonic.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# Push mode's `cross_silo` test issues real certs so push and mTLS can be
# exercised together — same generator `conflux-net`'s own mTLS tests use.
rcgen.workspace = true
