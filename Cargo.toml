[workspace]
resolver = "2"
members = [
    "crates/conflux-proto",
    "crates/conflux-config",
    "crates/conflux-registry",
    "crates/conflux-store",
    "crates/conflux-selector",
    "crates/conflux-net",
    "crates/conflux-buffer",
    "crates/conflux-privacy",
    "crates/conflux-reputation",
    "crates/conflux-core",
    "crates/conflux-server",
    "crates/conflux-node",
    "crates/conflux-attacks",
    "crates/conflux-trusted-reference",
    "crates/conflux-client",
    "crates/conflux-federation",
    "crates/conflux-baselines",
    "crates/cflux",
]

# Shared metadata. Every crate inherits these with `field.workspace =
# true`, so a version bump or a license change is one edit here rather
# than thirteen — and cannot be applied to twelve crates by accident.
[workspace.package]
version = "0.7.0"
edition = "2024"
# **Set by the dependencies, not by our own source.** `edition = "2024"`
# stabilized in 1.85 and nothing this workspace *writes* needs anything
# newer — but `tonic` 0.14, `jsonwebtoken` 11 and `time` 0.3.55 each
# declare 1.88, and every crate above `conflux-proto` pulls at least one
# of them. A 1.85 claim was carried here until a real 1.85 toolchain was
# finally run against it and refused to resolve eight of the twelve
# crates that made the promise.
#
# `clippy::incompatible_msrv` does not catch this: it checks whether the
# *std APIs we call* exist at the declared version, not whether our
# dependencies will build there. Only a real toolchain does.
#
# Two crates override this upward — see `conflux-store` and
# `conflux-server`.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/conflux-fl/conflux-fl"
readme = "README.md"

# Third-party dependency versions, declared once.
#
# Only *versions* live here. Features stay on each crate's own line
# (`tokio = { workspace = true, features = ["net"] }`), because they are
# genuinely per-crate: `conflux-store` needs tokio's `rt` for
# `spawn_blocking` and nothing else, while `conflux-node` needs `net`,
# `sync`, and `time`. Hoisting the union of every crate's features here
# would compile capabilities into crates that have no use for them and
# hide which crate actually depends on what.
[workspace.dependencies]
# The workspace's own crates. `version` alongside `path` is what makes
# them publishable: inside the workspace the path wins, and `cargo
# publish` strips the path and ships the version requirement, which is
# how a consumer's `cargo add conflux-server` pulls the rest of the
# graph. These thirteen move together with `package.version` above — a
# release bumps them here, not in thirteen manifests.
conflux-buffer = { path = "crates/conflux-buffer", version = "0.7.0" }
# Listed here rather than only in its own manifest because
# `conflux-federation` is the first crate to depend on it — an
# in-process federation supplies its clients in Rust.
conflux-client = { path = "crates/conflux-client", version = "0.7.0" }
conflux-federation = { path = "crates/conflux-federation", version = "0.7.0" }
conflux-config = { path = "crates/conflux-config", version = "0.7.0" }
conflux-core = { path = "crates/conflux-core", version = "0.7.0" }
conflux-net = { path = "crates/conflux-net", version = "0.7.0" }
conflux-node = { path = "crates/conflux-node", version = "0.7.0" }
conflux-privacy = { path = "crates/conflux-privacy", version = "0.7.0" }
conflux-proto = { path = "crates/conflux-proto", version = "0.7.0" }
conflux-registry = { path = "crates/conflux-registry", version = "0.7.0" }
conflux-reputation = { path = "crates/conflux-reputation", version = "0.7.0" }
conflux-selector = { path = "crates/conflux-selector", version = "0.7.0" }
conflux-server = { path = "crates/conflux-server", version = "0.7.0" }
conflux-store = { path = "crates/conflux-store", version = "0.7.0" }

# The `cflux` command line: derive-style argument parsing.
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
# `default-features = false` to shed the `rustls` feature, which drags
# in the LEGACY rustls-0.21/h2-0.3 stack alongside the modern one the
# `default-https-client` feature already provides — the old stack is
# where RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101) and
# RUSTSEC-2026-0258 (h2 0.3) live, and nothing here uses it. The other
# defaults are re-added explicitly.
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "sigv4a",
  "http-1x",
  "default-https-client",
  "rt-tokio",
] }
axum = "0.8"
criterion = "0.8"
http-body-util = "0.1"
inventory = "0.3"
jsonwebtoken = { version = "11", default-features = false }
prost = "0.14"
protoc-bin-vendored = "3"
rand = "0.10"
rand_distr = "0.6"
rcgen = "0.14"
redis = "1.6"
rustls-pki-types = "1"
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0"
tokio = "1"
tokio-postgres = "0.7"
tokio-stream = "0.1"
# `CancellationToken` only, which lives in `tokio-util`'s unconditional
# `sync` module — hence no features. Already in the graph via tonic and
# axum, so this is a direct edge to something already compiled.
tokio-util = { version = "0.7", default-features = false }
toml = "0.9"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-test = "0.2"
wide = "1.7"
