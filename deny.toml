# cargo-deny configuration — CI's `deny` job runs `cargo deny check`
# against this. Two gates:
#
#   advisories — known vulnerabilities from the RustSec database. A hit
#     fails the build; the fix is an upgrade, not an ignore, unless the
#     advisory genuinely cannot apply here (document any ignore inline).
#
#   licenses — everything a release of this Apache-2.0 project links
#     must be compatibly licensed. The allow-list below is deliberately
#     short; extending it is a licensing decision, not a build fix.

[advisories]
version = 2
yanked = "deny"
# These two are **unmaintained** advisories (no vulnerability, no fix to
# upgrade to), and both ride in ONLY through the optional, pre-1.0 `burn`
# dependency — the `burn` feature of `conflux-client`, which nothing this
# project ships ever compiles (`cargo build` without the feature never
# pulls them). Ignored with that scope in mind; drop these the day burn's
# tree stops depending on them.
ignore = [
  "RUSTSEC-2024-0436", # paste — unmaintained; transitive via burn
  "RUSTSEC-2025-0141", # bincode — unmaintained; transitive via burn
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  # Boost Software License — permissive, Apache-compatible; pulled in by
  # `xxhash-rust` (a redis dependency).
  "BSL-1.0",
  # Mozilla Public License 2.0 — weak, file-level copyleft: usable and
  # redistributable alongside Apache-2.0 as long as the MPL files
  # themselves are not modified (they are not; it is a dependency). Pulled
  # in ONLY via the optional `burn` dependency (`option-ext`, through
  # `dirs`). Accepting it is a deliberate licensing decision, scoped to
  # that optional feature.
  "MPL-2.0",
  # Creative Commons Zero — a public-domain dedication, and permissive
  # beyond MIT in what it allows. Pulled in ONLY via the optional `burn`
  # dependency, by `tiny-keccak` (a hashing crate in burn's tree since
  # 0.21).
  #
  # Accepted with one caveat worth writing down rather than discovering
  # later: CC0 deliberately does *not* grant patent rights, which is why
  # some organizations discourage it for code. That matters for a
  # patent-encumbered contribution, and does not for a Keccak
  # implementation of a published algorithm. Scoped to an optional
  # feature either way — `cargo deny` without `--all-features` never
  # resolves burn, so this entry does not match at all there.
  "CC0-1.0",
]

[bans]
multiple-versions = "allow"   # a fact of life in this tree; not a gate

[sources]
unknown-registry = "deny"
unknown-git = "deny"
