# Trimmed Mean (Yin et al. 2018) — coordinate-wise Byzantine-robust aggregation.
# Schema + walkthrough: https://confluxfl.dev/guides/baselines/ and https://confluxfl.dev/guides/baselines-add/

[paper]
title   = "Byzantine-Robust Distributed Learning: Towards Optimal Statistical Rates"
authors = "Yin, Chen, Ramchandran, Bartlett"
venue   = "ICML 2018"
url     = "https://proceedings.mlr.press/v80/yin18a.html"

[method]
aggregator = "trimmed_mean"
selector   = "uniform_random"

[experiment]
dataset   = "mnist"
model     = "mlp"
partition = "iid"

[scenario]
attackers      = 1
no_reputation  = true

[clients.python]
# The old 0.86 tracked the paper's logistic-regression row (Table 2:
# 86.9% for trimmed mean at m=40, beta=0.05). This setup is closer to
# Table 3 — a model with hidden units, few workers, a larger Byzantine
# fraction — where the paper reports 90.7%. Measured 0.923 on the shared
# harness (0.918 before clients were seeded independently), so the band is
# tight enough to catch a regression instead of admitting almost anything.
expected  = 0.91
tolerance = 0.05
smoke     = { clients = 5, rounds = 15 }

[clients.rust]
harness   = "burn_mlp"
expected  = 0.98 # Burn synthetic non-IID + 1 poisoned client, deterministic (seed 0)
tolerance = 0.05
smoke     = { clients = 5, rounds = 8 }
