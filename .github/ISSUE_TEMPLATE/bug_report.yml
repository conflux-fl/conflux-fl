name: Bug report
description: Something behaves differently from what its documentation or paper says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For **security vulnerabilities**, do not use this form — see
        [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: If a method deviates from its paper, name the paper and the claim.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest thing that shows it. A failing test is ideal.
      render: shell
    validations: {required: true}
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        Topology, mode, aggregator, and any CONFLUX_* variables set.
        The server logs every resolved parameter and its source at
        startup — pasting that block answers this completely.
      render: shell
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations: {required: true}
