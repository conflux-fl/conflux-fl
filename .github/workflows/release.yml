# Turns `git push origin vX.Y.Z` into a GitHub Release whose notes are that
# version's section of CHANGELOG.md — so the changelog is written once and
# the release page never drifts from it.
name: Release

on:
  push:
    tags: ["v*"]
  # Binaries for a tag that is already released — when a build failed, or
  # when the matrix itself was wrong and re-tagging is not an option
  # (`main` is protected, and a moved tag is a lie about what shipped).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build cflux binaries for (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub release from CHANGELOG
    # A manual run targets a release that already exists; recreating it
    # would overwrite notes someone may have edited.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract this version's CHANGELOG section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ ("^## \\[" v "\\]") { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No CHANGELOG section for $v — see CHANGELOG.md." > /tmp/notes.md
          fi
          echo "--- release notes ---"; head -20 /tmp/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Conflux FL ${{ github.ref_name }}
          body_path: /tmp/notes.md

  # Prebuilt `cflux` binaries, so evaluating Conflux FL does not start
  # with installing a Rust toolchain — the barrier the CLI exists to
  # remove would otherwise stand in front of the CLI itself.
  #
  # Built natively on each platform rather than cross-compiled: `cflux`
  # links `aws-lc-sys` (a C library, via `jsonwebtoken` and the AWS SDK),
  # and cross-compiling or statically linking that against musl is a
  # standing source of toolchain pain. Every runner here already has the
  # C toolchain it needs.
  binaries:
    name: cflux ${{ matrix.target }}
    # After the release exists, so these upload into it rather than
    # racing to create it — or straight away on a manual run, where it
    # already does.
    needs: release
    # `always()` because a dependency that was *skipped* — which is what
    # `release` is on a manual run — otherwise skips this job too.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      # One platform failing should not withhold the others: a missing
      # macOS archive is better than no archives at all.
      fail-fast: false
      matrix:
        include:
          # Not `ubuntu-latest`: a binary linked against the newest
          # glibc refuses to start on anything older, and an operator's
          # server is usually older than a CI runner.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "", archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "", archive: tar.gz }
          # Cross-compiled from the arm64 runner, not built on an Intel
          # one: GitHub retired `macos-13`, and the Intel images that
          # replaced it are larger runners rather than standard ones. The
          # cross is safe here in a way the musl one is not — Apple ships
          # both slices in one SDK, so clang targets x86_64 from arm64
          # with no third-party toolchain.
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "", archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe", archive: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cflux --target ${{ matrix.target }}
      - name: package with a checksum
        shell: bash
        run: |
          set -euo pipefail
          name="cflux-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/cflux${{ matrix.ext }}" "dist/$name/"
          # Ship the licence with the binary: a downloaded artifact
          # travels away from the repository that explains its terms.
          cp LICENSE NOTICE README.md "dist/$name/"
          strip "dist/$name/cflux${{ matrix.ext }}" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          archive="$name.${{ matrix.archive }}"
          # `sha256sum` on Linux and Git Bash, `shasum` on macOS.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "--- packaged ---"; ls -la "$archive" "$archive.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
